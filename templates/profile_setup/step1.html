{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Profile Setup - Step 1 of 3</h4>
                    <div class="progress mt-2">
                        <div class="progress-bar" role="progressbar" style="width: 33%">33%</div>
                    </div>
                </div>
                <div class="card-body">
                    <h5>Add Profile Picture</h5>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Profile Picture</label>
                            {{ form.profile_picture }}
                            {% if form.profile_picture.errors %}
                                <div class="text-danger">{{ form.profile_picture.errors }}</div>
                            {% endif %}
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Next: Add Email</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
