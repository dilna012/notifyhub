<!-- templates/accounts/login.html -->
{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="modern-card animate__animated animate__fadeIn">
                <div class="text-center mb-4">
                    <div class="display-1 text-primary">
                        <i class="fas fa-bell"></i>
                    </div>
                    <h2 class="fw-bold">Welcome Back!</h2>
                    <p class="text-muted">Sign in to continue to NotifyHub</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-500">
                            <i class="fas fa-user text-primary"></i> Username
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" name="username" class="form-control form-control-lg" 
                                   placeholder="Enter your username" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-500">
                            <i class="fas fa-lock text-primary"></i> Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" class="form-control form-control-lg" 
                                   placeholder="Enter your password" required>
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-modern btn-primary-modern">
                            <i class="fas fa-sign-in-alt"></i> Login
                        </button>
                    </div>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'forgot_password' %}">Forgot password?</a>
                </div>
                <div class="text-center mt-4">
                    <p class="text-muted">
                        <i class="fas fa-shield-alt"></i> Secure login powered by Django
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
